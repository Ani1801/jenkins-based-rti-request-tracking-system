# =========================================================================
# Nginx Reverse Proxy Configuration: RTI Request Tracking System
# Enforces reverse proxy architecture, public ingress boundaries,
# and isolation of internal management and administrative endpoints.
# =========================================================================

upstream backend_app {
    server app:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Maximum request body size for optional RTI attachments (2MB limit per SRS)
    client_max_body_size 5M;

    # Basic security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ---------------------------------------------------------------------
    # 1. Management Endpoints Restriction:
    # Actuator diagnostic and telemetry endpoints are blocked from public ingress.
    # Health checks within the container network query app:8080 directly.
    # ---------------------------------------------------------------------
    location /actuator/ {
        deny all;
        return 403 "Forbidden: Actuator management endpoints are internal only\n";
    }

    # ---------------------------------------------------------------------
    # 2. Administrative Reviewer Boundary Restriction:
    # The reviewer portal (reviewer.html) and administrative decision APIs
    # (/api/v1/reviewer/*) are restricted from public ingress in this MVP
    # deployment to prevent unauthorized access prior to Spring Security
    # authentication binding.
    # ---------------------------------------------------------------------
    location = /reviewer.html {
        deny all;
        return 403 "Forbidden: Reviewer administrative portal is restricted to internal network\n";
    }

    location /api/v1/reviewer/ {
        deny all;
        return 403 "Forbidden: Reviewer administrative APIs are restricted to internal network\n";
    }

    # ---------------------------------------------------------------------
    # 3. Public Citizen Portal & General Reverse Proxy Routing:
    # Routes public application filing (index.html), status inquiry (track.html),
    # static CSS/JS assets, and citizen REST endpoints to the Spring Boot backend.
    # ---------------------------------------------------------------------
    location / {
        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
