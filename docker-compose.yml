# =========================================================================
# Docker Compose: Jenkins-Based RTI Request Tracking System (MVP-13)
# Multi-container stack: Nginx Reverse Proxy + Spring Boot App + MySQL 8.x
# =========================================================================

services:
  # -----------------------------------------------------------------------
  # Database Service: MySQL 8.x Relational Store
  # -----------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: rti-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-rti_db}
      MYSQL_USER: ${DB_USER:-rti_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rti_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/db/migration/V1__init_rti_schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - rti-network
    # Port 3306 is isolated within rti-network and not exposed to the host by default.
    # To expose for local debugging, uncomment the ports block:
    # ports:
    #   - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # -----------------------------------------------------------------------
  # Application Service: Spring Boot (Java 17 LTS / Embedded Tomcat)
  # -----------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rti-request-tracking-system:1.0.0
    container_name: rti-app
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-rti_db}
      DB_USER: ${DB_USER:-rti_user}
      DB_PASSWORD: ${DB_PASSWORD:-rti_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080
    networks:
      - rti-network
    depends_on:
      mysql:
        condition: service_healthy
    # Internal port 8080 is exposed only to the bridge network, proxied by Nginx
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -----------------------------------------------------------------------
  # Ingress Proxy Service: Nginx Reverse Proxy
  # -----------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: rti-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - rti-network
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

# -------------------------------------------------------------------------
# Bridge Network for Container-to-Container DNS Resolution
# -------------------------------------------------------------------------
networks:
  rti-network:
    name: rti-network
    driver: bridge

# -------------------------------------------------------------------------
# Persistent Named Volume for MySQL Relational Data
# -------------------------------------------------------------------------
volumes:
  mysql_data:
    name: rti_mysql_data
