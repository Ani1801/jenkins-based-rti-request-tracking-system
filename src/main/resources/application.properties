# ===================================================================
# Spring Boot Application Properties
# Jenkins-Based RTI Request Tracking System (Academic Simulation)
# ===================================================================

# Application Identity & Port Configuration
spring.application.name=rti-request-tracking-system
server.port=${SERVER_PORT:8080}

# MySQL Database Configuration (Environment variable overrides with safe defaults)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rti_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:rti_user}
spring.datasource.password=${DB_PASSWORD:CHANGE_ME_IN_ENV}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Spring Boot Actuator Configuration
# Exposes health telemetry endpoint at /actuator/health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
