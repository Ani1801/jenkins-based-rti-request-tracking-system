# =========================================================================
# Ansible Vault Secrets Template: RTI Request Tracking System
#
# INSTRUCTIONS FOR PRODUCTION / SECURE DEPLOYMENT:
# 1. Copy this file to 'ansible/group_vars/vault.yml':
#      cp vault.example.yml vault.yml
# 2. Encrypt the file using Ansible Vault:
#      ansible-vault encrypt vault.yml
# 3. Supply vault password when running playbooks:
#      ansible-playbook -i inventory/hosts.ini playbooks/deploy.yml --ask-vault-pass
#
# NOTE: Never commit plaintext passwords or unencrypted vault.yml to Git.
# =========================================================================

# Database Passwords (Must match credentials used in MySQL container initialization)
vault_db_password: "CHANGE_ME_SECURE_USER_PASSWORD"
vault_db_root_password: "CHANGE_ME_SECURE_ROOT_PASSWORD"
