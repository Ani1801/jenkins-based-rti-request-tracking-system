# =========================================================================
# Ansible Inventory: RTI Request Tracking System (Academic Simulation)
# =========================================================================
# INSTRUCTIONS:
# 1. Replace placeholder IP (192.0.2.10 - RFC 5737 documentation prefix)
#    with the actual IP address or FQDN of your Linux deployment host.
# 2. Configure ansible_user with your remote Linux user account having sudo privileges.
# 3. Supply your SSH private key path or load keys into your SSH agent before running.
# =========================================================================

[rti_servers]
# Deployment Target Host (Ubuntu 22.04 / 24.04 LTS or Debian 12 recommended)
rti-app-node-01 ansible_host=192.0.2.10 ansible_user=deploy_user ansible_port=22

[rti_servers:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
